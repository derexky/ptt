name: Deploy to myhost

on:
  push:
    branches: [feature/test, main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          DOCKER=docker

          echo "=== Git fetch + reset ==="
          $DOCKER run --rm \
            -v /share/homes/derexky/.ssh/ptt_deploy_key:/root/ptt_deploy_key:ro \
            -v /share/CACHEDEV1_DATA/ptt:/repo \
            -e "GIT_SSH_COMMAND=ssh -i /root/ptt_deploy_key -o StrictHostKeyChecking=no" \
            --entrypoint sh \
            alpine/git -c "git -c safe.directory=/repo -C /repo fetch origin && git -c safe.directory=/repo -C /repo reset --hard origin/${GITHUB_REF_NAME}"

          echo "=== Docker build ==="
          DOCKER_BUILDKIT=0 $DOCKER build -t ptt-scheduler:latest /share/CACHEDEV1_DATA/ptt

          echo "=== Restart container ==="
          $DOCKER rm -f ptt-scheduler 2>/dev/null || true
          $DOCKER run -d --name ptt-scheduler \
            --env-file /share/CACHEDEV1_DATA/ptt-scheduler.env \
            ptt-scheduler:latest

          echo "=== Prune images ==="
          $DOCKER image prune -f

          $DOCKER ps --filter name=ptt-scheduler
