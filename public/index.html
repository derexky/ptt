<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Army</title>
    <style>
      :root {
        --primary: #4f46e5;
        --bg: #f3f4f6;
        --card: #ffffff;
        --text: #1f2937;
      }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
      }
      .container {
        width: 100%;
        max-width: 800px;
        background: var(--card);
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      h2 {
        margin-top: 0;
        border-bottom: 2px solid var(--bg);
        padding-bottom: 15px;
      }

      /* Grid Layout */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }
      .full-width {
        grid-column: span 2;
      }

      /* Form Elements */
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        font-size: 0.9em;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 14px;
      }
      textarea {
        resize: vertical;
        min-height: 100px;
      }

      /* Toggles & Radios */
      .radio-group {
        display: flex;
        gap: 20px;
        background: #f9fafb;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #e5e7eb;
      }
      .radio-item {
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }
      .radio-item input {
        width: auto;
        margin: 0;
      }

      /* Conditional Sections */
      .hidden {
        display: none;
      }

      /* Button */
      button {
        width: 100%;
        padding: 14px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      button:hover {
        opacity: 0.9;
      }
      button:disabled {
        background-color: #9ca3af;
        cursor: not-allowed;
      }

      /* Response Area */
      #responseArea {
        margin-top: 20px;
        background: #1e1e1e;
        color: #00ff00;
        padding: 15px;
        border-radius: 6px;
        font-family: monospace;
        white-space: pre-wrap;
        display: none;
        font-size: 13px;
        word-break: break-all; /* 確保長網址會換行 */
      }
      .error {
        color: #ff6b6b !important;
      }

      .helper-text {
        font-size: 0.8em;
        color: #6b7280;
        margin-top: 2px;
      }

      #progressArea {
        margin-top: 16px;
        padding: 14px;
        border-radius: 8px;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        font-size: 14px;
        display: none;
      }
      #progressArea.active {
        display: block;
      }
      #progressArea .progress-meta {
        color: #166534;
        font-weight: 600;
        margin-bottom: 8px;
      }
      #progressArea .progress-bar-wrap {
        height: 8px;
        background: #dcfce7;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 8px;
      }
      #progressArea .progress-bar {
        height: 100%;
        width: 0%;
        background: #16a34a;
        transition: width 0.25s ease;
      }
      #progressArea.error-panel {
        background: #fef2f2;
        border-color: #fecaca;
      }
      #progressArea.error-panel .progress-meta {
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>🤖 One Army</h2>

      <form id="postForm">
        <div class="grid">
          <div class="full-width">
            <label>選擇伺服器區域 (Region)</label>
            <select id="region">
              <option value="asia">Asia</option>
              <option value="europe">Europe</option>
              <option value="us">US</option>
            </select>
            <div class="helper-text">系統將自動對應至指定的 Cloud Run URL</div>
          </div>

          <div class="full-width">
            <label>選項</label>
            <div class="radio-group">
              <label class="radio-item">
                <input type="checkbox" id="isSendByWord" /> 逐字傳送
              </label>
            </div>
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0" />

        <div class="grid">
          <div>
            <label>帳號 (ID)</label>
            <input type="text" id="userId" required />
          </div>
          <div>
            <label>密碼 (Password)</label>
            <input type="password" id="userPass" required />
          </div>
        </div>

        <div class="grid">
          <div>
            <label>看板名稱 (Board)</label>
            <input
              type="text"
              id="board"
              placeholder="例如: Gossiping"
              required
            />
          </div>
          <div>
            <label>立場 (Stance)</label>
            <input type="text" id="stance" placeholder="例如: 客觀 / 偏激" />
          </div>
        </div>

        <div class="full-width" style="margin-bottom: 20px">
          <label>操作模式</label>
          <div class="radio-group">
            <label class="radio-item">
              <input
                type="radio"
                name="postMode"
                value="new"
                checked
                onchange="toggleMode()"
              />
              發新文章 (New Post)
            </label>
            <label class="radio-item">
              <input
                type="radio"
                name="postMode"
                value="reply"
                onchange="toggleMode()"
              />
              回覆文章 (Reply)
            </label>
          </div>
        </div>

        <div id="newPostFields" class="grid full-width">
          <div class="full-width">
            <label>文章標題 (Subject)</label>
            <input type="text" id="subject" placeholder="請輸入標題" />
          </div>
          <div class="full-width">
            <label>草稿內容 (Draft)</label>
            <textarea id="draft" placeholder="請輸入文章內容..."></textarea>
          </div>
          <div class="full-width">
            <label>發文類別編號 (Category)</label>
            <input
              type="number"
              id="category"
              min="1"
              step="1"
              placeholder="EX: 1, 2, 3...."
            />
          </div>
        </div>

        <div id="replyFields" class="grid full-width hidden">
          <div>
            <label>回覆文章代碼 (Article ID #)</label>
            <input
              type="text"
              id="replyId"
              placeholder="EX: #c8763..."
            />
          </div>
          <div>
            <label>目標對象 (Target)</label>
            <input
              type="text"
              id="target"
              placeholder="指定嘲諷人事物 (選填)"
            />
          </div>
        </div>

        <button type="submit" id="submitBtn">🚀 開始執行任務</button>
      </form>

      <div id="responseArea"></div>
      <div id="progressArea" aria-live="polite">
        <div class="progress-meta" id="progressTitle">發文進度</div>
        <div id="progressDetail"></div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
    </div>

    <!-- 進度訂閱：設定見 public/firebase-config.js；Rules 見 firestore.rules -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>

    <script>
      const FIREBASE_CONFIG = window.__FIREBASE_CONFIG__ || {}

      const firebaseReady =
        typeof firebase !== 'undefined' &&
        FIREBASE_CONFIG.projectId &&
        FIREBASE_CONFIG.apiKey &&
        FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY' &&
        FIREBASE_CONFIG.appId &&
        FIREBASE_CONFIG.appId !== 'YOUR_APP_ID' &&
        FIREBASE_CONFIG.messagingSenderId &&
        FIREBASE_CONFIG.messagingSenderId !== 'YOUR_MESSAGING_SENDER_ID'

      let progressUnsub = null

      function stopProgressWatch() {
        if (typeof progressUnsub === 'function') {
          progressUnsub()
          progressUnsub = null
        }
      }

      function formatProgressDoc(d) {
        if (!d) return ''
        const pct =
          typeof d.percent === 'number' && !Number.isNaN(d.percent)
            ? `${d.percent}%`
            : '—'
        const lines = [
          `狀態: ${d.status ?? '—'}`,
          `階段: ${d.phase ?? '—'}`,
          `進度: ${pct}`,
        ]
        if (d.progressType != null) {
          lines.push(
            `細項: ${d.progressType} ${d.progressCurrent ?? ''}/${d.progressTotal ?? ''}`
          )
        }
        if (d.message) lines.push(`說明: ${d.message}`)
        if (d.error) lines.push(`錯誤: ${d.error}`)
        if (d.replyUrl) lines.push(`文章網址: ${d.replyUrl}`)
        return lines.join('\n')
      }

      /** 訂閱 postJobs/{jobId}，與後端 functions/index.js 寫入的路徑一致 */
      function startProgressWatch(jobId) {
        stopProgressWatch()
        const panel = document.getElementById('progressArea')
        const titleEl = document.getElementById('progressTitle')
        const detailEl = document.getElementById('progressDetail')
        const barEl = document.getElementById('progressBar')

        if (!jobId) {
          panel.classList.remove('active', 'error-panel')
          return
        }

        if (!firebaseReady) {
          panel.classList.add('active')
          panel.classList.remove('error-panel')
          titleEl.textContent = '即時進度（未啟用）'
          detailEl.textContent =
            '請編輯 public/firebase-config.js（取代 YOUR_* 占位字），並執行 firebase deploy --only firestore:rules。\njobId: ' +
            jobId
          barEl.style.width = '0%'
          return
        }

        panel.classList.add('active')
        panel.classList.remove('error-panel')
        titleEl.textContent = '發文進度（即時）'
        detailEl.textContent = '連線 Firestore…\njobId: ' + jobId
        barEl.style.width = '0%'

        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(FIREBASE_CONFIG)
          }
          const db = firebase.firestore()
          const ref = db.collection('postJobs').doc(jobId)

          progressUnsub = ref.onSnapshot(
            (snap) => {
              if (!snap.exists) {
                detailEl.textContent =
                  '等待後端建立 job 文件…\njobId: ' + jobId
                return
              }
              const d = snap.data()
              detailEl.textContent = formatProgressDoc(d)
              const p =
                typeof d.percent === 'number' && !Number.isNaN(d.percent)
                  ? Math.max(0, Math.min(100, d.percent))
                  : 0
              barEl.style.width = p + '%'

              if (d.status === 'failed') {
                panel.classList.add('error-panel')
                titleEl.textContent = '發文失敗'
              } else if (d.status === 'done' || d.phase === 'completed') {
                panel.classList.remove('error-panel')
                titleEl.textContent = '發文完成'
              } else {
                panel.classList.remove('error-panel')
                titleEl.textContent = '發文進行中'
              }
            },
            (err) => {
              panel.classList.add('active', 'error-panel')
              titleEl.textContent = '無法訂閱進度'
              detailEl.textContent =
                err.message +
                '\n\n請確認已執行 firebase deploy --only firestore:rules，且規則允許讀取 postJobs；firebase-config.js 須與後端同一專案。'
              barEl.style.width = '0%'
            }
          )
        } catch (err) {
          panel.classList.add('active', 'error-panel')
          titleEl.textContent = '無法訂閱進度'
          detailEl.textContent = (err && err.message) || String(err)
          barEl.style.width = '0%'
        }
      }

      // 定義 API 對照表
      const API_URLS = {
        asia: '/api/asia', // 替換為簡單的代理路徑
        europe: '/api/eu', // 替換為簡單的代理路徑
        us: '/api/us', // 替換為簡單的代理路徑
      }

      // 1. 切換模式顯示邏輯
      function toggleMode() {
        const isNewPost =
          document.querySelector('input[name="postMode"]:checked').value ===
          'new'
        const newFields = document.getElementById('newPostFields')
        const replyFields = document.getElementById('replyFields')

        if (isNewPost) {
          newFields.classList.remove('hidden')
          replyFields.classList.add('hidden')

          // 設定 required 屬性以確保表單驗證
          document.getElementById('subject').setAttribute('required', '')
          document.getElementById('replyId').removeAttribute('required')
        } else {
          newFields.classList.add('hidden')
          replyFields.classList.remove('hidden')

          document.getElementById('subject').removeAttribute('required')
          document.getElementById('replyId').setAttribute('required', '')
        }
      }

      // 2. 表單提交邏輯
      document
        .getElementById('postForm')
        .addEventListener('submit', async function (e) {
          e.preventDefault()

          const submitBtn = document.getElementById('submitBtn')
          const responseArea = document.getElementById('responseArea')
          const regionKey = document.getElementById('region').value
          const isNewPost =
            document.querySelector('input[name="postMode"]:checked').value ===
            'new'

          // 直接從對照表取得 URL
          const apiUrl = API_URLS[regionKey]

          if (!apiUrl) {
            alert('錯誤：找不到對應的 API URL')
            return
          }

          // 準備 Payload
          const payload = {
            id: document.getElementById('userId').value,
            password: document.getElementById('userPass').value,
            isNewPost: isNewPost,
            args: {
              board: document.getElementById('board').value,
              stance: document.getElementById('stance').value,
              // 根據模式填入對應欄位
              subject: isNewPost
                ? document.getElementById('subject').value
                : null,
              category:
                Number(document.getElementById('category').value) || 1,
              draft: isNewPost ? document.getElementById('draft').value : null,
              reply: !isNewPost
                ? document.getElementById('replyId').value
                : null,
              target: !isNewPost
                ? document.getElementById('target').value
                : null,
              // 修正：加上安全檢查，避免 checkbox 不存在時報錯
              isSendByWord: document.getElementById('isSendByWord')
                ? document.getElementById('isSendByWord').checked
                : false,
            },
          }

          // UI 狀態更新
          submitBtn.disabled = true
          submitBtn.textContent = '處理中...'
          responseArea.style.display = 'block'
          responseArea.textContent = '正在呼叫 API...\nURL: ' + apiUrl
          responseArea.className = ''
          stopProgressWatch()
          document.getElementById('progressArea').classList.remove('active')

          try {
            const res = await fetch(apiUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(payload),
            })

            // 處理非 JSON 回傳 (例如純文字錯誤訊息)
            let data
            const contentType = res.headers.get('content-type')
            if (contentType && contentType.indexOf('application/json') !== -1) {
              data = await res.json()
            } else {
              data = await res.text()
            }

            if (!res.ok) {
              const errorMsg =
                typeof data === 'object' && data.error ? data.error : data
              if (typeof data === 'object' && data.jobId) {
                startProgressWatch(data.jobId)
              }
              throw new Error(errorMsg || `HTTP error! status: ${res.status}`)
            }

            responseArea.textContent =
              '✅ 成功:\n' + JSON.stringify(data, null, 2)

            if (typeof data === 'object' && data.jobId) {
              startProgressWatch(data.jobId)
            }
          } catch (error) {
            responseArea.className = 'error'
            responseArea.textContent = '❌ 發生錯誤:\n' + error.message

            if (error.message.includes('Failed to fetch')) {
              responseArea.textContent +=
                '\n\n(提示: 請檢查是否已開啟 CORS，或 URL 是否正確)'
            }
          } finally {
            submitBtn.disabled = false
            submitBtn.textContent = '🚀 開始執行任務'
          }
        })

      // 初始化
      toggleMode()
    </script>
  </body>
</html>
